# SurrealDB Version Monitor
# Checks daily for new SurrealDB 3.x releases, runs tests, and auto-updates.
#
# Flow:
#   1. Compare .surrealdb-version against the newest stable v3.x GitHub release
#      (by version, across every page — not the first one listed: #234)
#   2. If same version → skip (no wasted CI minutes)
#   3. If new version → run unit + integration tests against it
#   4. If tests pass → create PR with .surrealdb-version + docker-compose.yml update
#   5. PR triggers normal CI pipeline → auto-merged via gh pr merge --auto
#   6. If security patch → also bump ORM version in the same PR
#   7. If tests fail → create GitHub issue for investigation

name: SurrealDB Version Monitor

on:
  schedule:
    # Run daily at 7:00 AM Montreal time (UTC-5 → 12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      surrealdb_version:
        description: 'SurrealDB version to test (e.g. 3.0.1, leave empty for latest v3.x)'
        required: false
        type: string
      force_update:
        description: 'Force update even if version matches'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  SURREALDB_URL: http://localhost:8000
  SURREALDB_USER: root
  SURREALDB_PASS: root
  SURREALDB_NAMESPACE: test
  SURREALDB_DATABASE: test

jobs:
  # =============================================================================
  # Step 1: Check if there is a new SurrealDB 3.x release
  # =============================================================================
  check-release:
    name: Check SurrealDB Release
    runs-on: ubuntu-latest
    outputs:
      latest-version: ${{ steps.check.outputs.latest-version }}
      current-version: ${{ steps.check.outputs.current-version }}
      has-update: ${{ steps.check.outputs.has-update }}
      is-security-patch: ${{ steps.check.outputs.is-security-patch }}
      release-notes: ${{ steps.check.outputs.release-notes }}
      docker-tag: ${{ steps.check.outputs.docker-tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compare versions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Inputs reach the script as data, as in the pre-release canary.
          INPUT_VERSION: ${{ inputs.surrealdb_version }}
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          # --- Determine latest v3.x version ---
          if [[ -n "$INPUT_VERSION" ]]; then
            LATEST_VERSION="$INPUT_VERSION"

            # This monitor owns the 3.X line only. A new major is prepared
            # deliberately, never through a pin PR that auto-merges and releases.
            # The whole value must be a version, since it becomes the pin, the
            # image tag and the PR title: checking only the text before the
            # first dot let `3.3` or `3.3.5 ` through.
            VERSION_RE='^3\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
            if [[ ! "$LATEST_VERSION" =~ $VERSION_RE ]]; then
              echo "ERROR: the dispatched version is not a 3.X.Y release: $LATEST_VERSION"
              echo "This workflow only supports SurrealDB 3.X."
              exit 1
            fi
          else
            # The newest *stable* v3.x release, by version — not by position.
            # The API lists releases by tag creation date, so a backport on an
            # older line hides the newest one: v3.2.6 was listed above v3.3.4,
            # `[...][0]` picked it, the no-downgrade guard below refused it, and
            # the run ended green with the pin stuck at 3.3.0 (#234). Hence every
            # page (`--paginate` applies `--jq` to each one) and `sort -V`.
            # Pre-releases are excluded on purpose: this pin is the SurrealDB
            # version the library declares support for and runs CI against, and
            # a bump to it cascades into a published PyPI release. #163 pinned
            # 3.3.0-beta.3 and burned three such releases (0.32.3-0.32.5). The
            # `sed` also drops any tag that is not a plain 3.X.Y: `sort -V` would
            # rank a mislabelled 3.4.0-rc.1 above every 3.3.x.
            # An API failure fails the step here: it is not "nothing to do".
            RELEASE_TAGS=$(gh api --paginate "repos/surrealdb/surrealdb/releases?per_page=100" \
              --jq '.[] | select(.tag_name | startswith("v3.")) | select(.prerelease == false) | select(.draft == false) | .tag_name')
            LATEST_VERSION=$(printf '%s\n' "$RELEASE_TAGS" \
              | sed -nE 's/^v(3\.[0-9]+\.[0-9]+)$/\1/p' | sort -V | tail -1)

            # No fallback to `releases/latest`: that is the newest release of
            # *any* line, so it would propose 4.0.0 the day it ships.
            if [[ -z "$LATEST_VERSION" ]]; then
              echo "No stable SurrealDB 3.X release found — nothing to do."
              echo "has-update=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # --- Read current pinned version ---
          if [[ -f ".surrealdb-version" ]]; then
            CURRENT_VERSION=$(cat .surrealdb-version | tr -d '[:space:]')
          else
            CURRENT_VERSION="unknown"
          fi

          DOCKER_TAG="v${LATEST_VERSION}"

          echo "Current: $CURRENT_VERSION"
          echo "Latest:  $LATEST_VERSION"
          echo "Docker:  $DOCKER_TAG"

          # --- Compare: skip if already up to date, and NEVER downgrade ---
          # A plain `!=` treats "different" as "newer", which is wrong whenever
          # GitHub Releases lag Docker Hub: SurrealDB shipped 3.2.1-3.2.3 as
          # image tags without release entries, so the newest v3.x *release* was
          # v3.2.0 while .surrealdb-version already read 3.2.3. The monitor then
          # opened a PR *downgrading* the pin (#155). Compare with `sort -V` and
          # only act when the candidate is strictly newer.
          # A pre-release is never a candidate (#163). The API query already
          # filters them, but `workflow_dispatch` feeds `surrealdb_version`
          # straight through, and `sort -V` has no notion of a pre-release: it
          # ranks 3.3.0-beta.3 *above* 3.3.0, so a beta pin would also refuse
          # every later stable as a "downgrade" and stay stuck forever.
          HAS_UPDATE="false"
          if [[ "$LATEST_VERSION" == *-* ]]; then
            echo "Candidate ($LATEST_VERSION) is a pre-release — not pinning."
          elif [[ "$CURRENT_VERSION" == *-* ]]; then
            # The pin itself is a pre-release: any stable release supersedes it.
            echo "Current pin ($CURRENT_VERSION) is a pre-release — replacing with $LATEST_VERSION."
            HAS_UPDATE="true"
          elif [[ "$CURRENT_VERSION" != "$LATEST_VERSION" ]]; then
            NEWEST=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | tail -1)
            if [[ "$NEWEST" == "$LATEST_VERSION" ]]; then
              HAS_UPDATE="true"
            else
              echo "Latest release ($LATEST_VERSION) is older than the current pin ($CURRENT_VERSION) — not downgrading."
            fi
          fi

          # Force update overrides the check
          if [[ "$FORCE_UPDATE" == "true" ]]; then
            HAS_UPDATE="true"
          fi

          if [[ "$HAS_UPDATE" == "false" ]]; then
            echo "Already on latest version ($CURRENT_VERSION) — nothing to do."
          fi

          # --- Check if security patch ---
          IS_SECURITY_PATCH="false"
          if [[ "$HAS_UPDATE" == "true" ]]; then
            # Look the release up by its tag. Scanning the first page of the list
            # missed any release beyond it, and a security release read as
            # "no notes" would be pinned without the version bump that ships it.
            # A version with no release entry (an image-only tag, #155) has no
            # notes, which must not abort the run. `gh` then exits 1 and prints
            # the 404 body on stdout, unfiltered by `--jq`: discard it.
            RELEASE_NOTES=$(gh api "repos/surrealdb/surrealdb/releases/tags/v${LATEST_VERSION}" \
              --jq '.body' 2>/dev/null) || RELEASE_NOTES=""
            RELEASE_NOTES=${RELEASE_NOTES:0:5000}

            if echo "$RELEASE_NOTES" | grep -iE "(security|vulnerability|CVE-[0-9]|critical.*(fix|patch)|exploit|injection|xss|csrf)" > /dev/null 2>&1; then
              IS_SECURITY_PATCH="true"
            fi

            RELEASE_TITLE=$(gh api "repos/surrealdb/surrealdb/releases/tags/v${LATEST_VERSION}" \
              --jq '.name' 2>/dev/null) || RELEASE_TITLE=""
            if echo "$RELEASE_TITLE" | grep -iE "(security|hotfix|CVE)" > /dev/null 2>&1; then
              IS_SECURITY_PATCH="true"
            fi
          else
            RELEASE_NOTES=""
          fi

          echo "Has update: $HAS_UPDATE"
          echo "Is security patch: $IS_SECURITY_PATCH"

          # --- Set outputs ---
          echo "latest-version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "has-update=$HAS_UPDATE" >> $GITHUB_OUTPUT
          echo "is-security-patch=$IS_SECURITY_PATCH" >> $GITHUB_OUTPUT
          echo "docker-tag=$DOCKER_TAG" >> $GITHUB_OUTPUT

          {
            echo 'release-notes<<EOF'
            echo "$RELEASE_NOTES"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

  # =============================================================================
  # Step 2: Run tests against the new SurrealDB version
  # =============================================================================
  test-new-version:
    name: Test SurrealDB ${{ needs.check-release.outputs.latest-version }}
    needs: check-release
    if: needs.check-release.outputs.has-update == 'true'
    runs-on: ubuntu-latest
    outputs:
      tests-passed: ${{ steps.test-result.outputs.passed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Start SurrealDB ${{ needs.check-release.outputs.docker-tag }}
        env:
          DOCKER_TAG: ${{ needs.check-release.outputs.docker-tag }}
        run: |
          echo "Testing with SurrealDB Docker tag: $DOCKER_TAG"

          docker run -d \
            --name surrealdb-test \
            -p 8000:8000 \
            "surrealdb/surrealdb:${DOCKER_TAG}" \
            start --log error --user root --pass root memory

          ./devops/wait-for-healthy.sh localhost 8000 60

          RUNNING_VERSION=$(curl -s http://localhost:8000/version || echo "unknown")
          echo "Running SurrealDB version: $RUNNING_VERSION"

      - name: Run unit tests
        run: |
          uv run pytest tests/ -m "not integration" \
            --junitxml=junit-unit.xml \
            --cov=src \
            --cov-branch

      - name: Run integration tests
        env:
          SURREALDB_SKIP_CONTAINER: "true"
        run: |
          uv run pytest tests/ -m integration \
            --junitxml=junit-integration.xml \
            --cov=src \
            --cov-branch \
            -v

      - name: Stop SurrealDB
        if: always()
        run: docker stop surrealdb-test && docker rm surrealdb-test || true

      - name: Set test result
        id: test-result
        if: success()
        run: echo "passed=true" >> $GITHUB_OUTPUT

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: surrealdb-test-results
          path: junit-*.xml

  # =============================================================================
  # Step 3: Tests passed → create PR with version update (respects branch protection)
  # =============================================================================
  auto-update:
    name: Update SurrealDB Version
    needs: [check-release, test-new-version]
    if: |
      needs.check-release.outputs.has-update == 'true' &&
      needs.test-new-version.outputs.tests-passed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update .surrealdb-version and docker-compose.yml
        env:
          NEW_VERSION: ${{ needs.check-release.outputs.latest-version }}
          DOCKER_TAG: ${{ needs.check-release.outputs.docker-tag }}
        run: |
          BRANCH="chore/surrealdb-${NEW_VERSION}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

          git checkout -b "$BRANCH"

          echo "$NEW_VERSION" > .surrealdb-version

          # Update docker-compose image tags (v3, v3.0.0, v3.0.0-beta.1, etc.)
          sed -i "s|surrealdb/surrealdb:v[0-9][0-9a-zA-Z._-]*|surrealdb/surrealdb:${DOCKER_TAG}|g" devops/docker-compose.yml

          git add .surrealdb-version devops/docker-compose.yml

          if git diff --staged --quiet; then
            echo "No changes to commit (shouldn't happen at this point)"
            exit 0
          fi

          git commit -m "chore(deps): update SurrealDB to v${NEW_VERSION}

          Tests passed against SurrealDB v${NEW_VERSION}.
          Previous version: v${{ needs.check-release.outputs.current-version }}"

      - name: Push branch and create update PR
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          IS_SECURITY: ${{ needs.check-release.outputs.is-security-patch }}
        run: |
          git push -u origin "$BRANCH"

          TITLE="chore(deps): update SurrealDB to v${NEW_VERSION}"
          if [[ "$IS_SECURITY" == "true" ]]; then
            TITLE="security(deps): update SurrealDB to v${NEW_VERSION}"
          fi

          PR_URL=$(gh pr create \
            --title "$TITLE" \
            --body "## SurrealDB Version Update

          - **Previous:** v${{ needs.check-release.outputs.current-version }}
          - **New:** v${NEW_VERSION}
          - **Security patch:** ${IS_SECURITY}

          Tests already passed against this version in the [monitor workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          ---
          *Automatically created by the SurrealDB version monitor.*" \
            --base main \
            --head "$BRANCH")

          echo "PR_URL=$PR_URL" >> $GITHUB_ENV
          echo "Created PR: $PR_URL"

          gh pr merge "$PR_URL" --auto --squash

      - name: Wait for update PR to merge
        id: wait-merge
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          MAX_ATTEMPTS=30
          ATTEMPT=0

          while [[ $ATTEMPT -lt $MAX_ATTEMPTS ]]; do
            STATE=$(gh pr view "$PR_NUMBER" --json state -q '.state')
            if [[ "$STATE" == "MERGED" ]]; then
              echo "Update PR merged successfully"
              echo "merged=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Waiting for PR to merge... (attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)"
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "PR did not merge in time"
          echo "merged=false" >> $GITHUB_OUTPUT
          exit 1

      # --- After merge: create version bump PR (triggers tag-release.yml → publish.yml) ---
      - name: Checkout main after merge
        if: steps.wait-merge.outputs.merged == 'true'
        run: |
          git fetch origin main
          git checkout main
          git pull origin main

      - name: Install uv
        if: steps.wait-merge.outputs.merged == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Create version bump PR
        if: steps.wait-merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Calculate version from main's pyproject.toml
          CURRENT_VERSION=$(grep -E '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)
          NEW_ORM_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          NEW_TAG="v${NEW_ORM_VERSION}"
          BUMP_BRANCH="chore/release-${NEW_TAG}"

          echo "Version bump: $CURRENT_VERSION → $NEW_ORM_VERSION"

          git checkout -b "$BUMP_BRANCH"

          # Update version files
          sed -i "s/^version = \".*\"/version = \"$NEW_ORM_VERSION\"/" pyproject.toml
          sed -i "s/__version__ = \".*\"/__version__ = \"$NEW_ORM_VERSION\"/" src/surreal_orm/__init__.py
          sed -i "s/__version__ = \".*\"/__version__ = \"$NEW_ORM_VERSION\"/" src/surreal_sdk/__init__.py
          sed -i "s/^version = \".*\"/version = \"$NEW_ORM_VERSION\"/" src/surreal_sdk/pyproject.toml

          # Regenerate lockfile
          uv lock

          git add pyproject.toml src/surreal_orm/__init__.py src/surreal_sdk/__init__.py src/surreal_sdk/pyproject.toml uv.lock
          git commit -m "chore(release): bump version to $NEW_ORM_VERSION"
          git push origin "$BUMP_BRANCH"

          gh pr create \
            --title "chore(release): bump version to $NEW_ORM_VERSION" \
            --body "## Version Bump

          Automated version bump after SurrealDB update to v${NEW_VERSION}.

          ---
          *This PR was automatically created by the SurrealDB version monitor.*" \
            --base main \
            --head "$BUMP_BRANCH"

          gh pr merge --auto --squash "$BUMP_BRANCH"

  # =============================================================================
  # Step 4: Tests failed → create GitHub issue
  # =============================================================================
  create-failure-issue:
    name: Create Failure Issue
    needs: [check-release, test-new-version]
    # `always()` is required: without a status-check function GitHub implicitly
    # ANDs `success()` into the condition, so this job — which by definition only
    # runs when `test-new-version` failed — was always skipped.
    if: |
      always() &&
      needs.check-release.outputs.has-update == 'true' &&
      needs.test-new-version.result == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Create issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="SurrealDB v${{ needs.check-release.outputs.latest-version }} — integration tests failed"

          # Skip if an open issue already exists
          EXISTING=$(gh issue list --state open --search "$ISSUE_TITLE" --json number -q '.[0].number')
          if [[ -n "$EXISTING" ]]; then
            echo "Issue #$EXISTING already exists — skipping"
            exit 0
          fi

          gh issue create \
            --title "$ISSUE_TITLE" \
            --label "bug,surrealdb,needs-investigation" \
            --body "$(cat <<EOF
          ## SurrealDB Compatibility Issue

          Integration tests failed with SurrealDB v${{ needs.check-release.outputs.latest-version }}.

          | Field | Value |
          |---|---|
          | Current version | v${{ needs.check-release.outputs.current-version }} |
          | New version | v${{ needs.check-release.outputs.latest-version }} |
          | Security patch | ${{ needs.check-release.outputs.is-security-patch }} |

          ### Workflow Run
          [View logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ---
          *Automatically created by the SurrealDB version monitor.*
          EOF
          )"
