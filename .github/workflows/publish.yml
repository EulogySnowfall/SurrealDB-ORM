name: Publish to PyPI

# This is the v3 branch's copy (SurrealDB 3.x, bug and advisory fixes only).
# A tag push runs the tagged commit's own workflow file, so this file only ever
# sees tags pushed on v3 commits; main's publish.yml handles main's tags.

permissions:
  contents: read

on:
  push:
    tags:
      - 'v0.39.*'  # v3 maintenance tags (v0.39.10, v0.39.11, ...)

jobs:
  # Publish only a v0.39.Z tag whose commit is on v3. Any other tag, by name
  # or by commit, is refused: the job fails and nothing is built or published.
  check-v3:
    name: Verify tag is on v3
    runs-on: ubuntu-latest
    outputs:
      on-v3: ${{ steps.check.outputs.on-v3 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag name and that the tagged commit is on v3
        id: check
        env:
          TAG: ${{ github.ref_name }}
          TAGGED_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$TAG" =~ ^v0\.39\.[0-9]+$ ]]; then
            echo "::error::v3 publishes v0.39.Z tags only; refusing this tag"
            exit 1
          fi
          git fetch origin v3
          if git merge-base --is-ancestor "$TAGGED_SHA" origin/v3; then
            echo "on-v3=true" >> "$GITHUB_OUTPUT"
            echo "Tag is on v3 — will publish to PyPI"
          else
            echo "on-v3=false" >> "$GITHUB_OUTPUT"
            echo "::error::the tagged commit is not on v3; refusing to publish"
            exit 1
          fi

  build:
    name: Build Package
    needs: check-v3
    if: needs.check-v3.outputs.on-v3 == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing - no API token needed
        # Configure at: https://pypi.org/manage/project/surrealdb-orm/settings/publishing/

  github-release:
    name: Create GitHub Release
    needs: [check-v3, build]
    if: needs.check-v3.outputs.on-v3 == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        # v3 = same action, runtime moved Node 20 -> Node 24 (no input/behaviour changes)
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # v3 is a maintenance line: never claim the repository's "Latest"
          # release, which belongs to main (softprops defaults to true).
          make_latest: false
