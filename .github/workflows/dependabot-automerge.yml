# Auto-merge Dependabot PRs after successful tests
# Bumps the patch (3rd) digit for security updates: x.y.z → x.y.(z+1)
# Versioning: X=LTS/breaking, Y=features, Z=security patches

name: Dependabot Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  SURREALDB_URL: http://localhost:8000
  SURREALDB_USER: root
  SURREALDB_PASS: root
  SURREALDB_NAMESPACE: test
  SURREALDB_DATABASE: test

jobs:
  # =============================================================================
  # Check if this is a Dependabot PR
  # =============================================================================
  check-dependabot:
    name: Check Dependabot PR
    runs-on: ubuntu-latest
    outputs:
      is-dependabot: ${{ steps.check.outputs.is-dependabot }}
      is-security-sync: ${{ steps.check.outputs.is-security-sync }}
      should-process: ${{ steps.check.outputs.should-process }}
    steps:
      - name: Check if Dependabot or security-sync PR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IS_DEPENDABOT="false"
          IS_SECURITY_SYNC="false"

          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            IS_DEPENDABOT="true"
          fi

          # Read labels via API to avoid race condition with pull_request_target
          # (labels set during PR creation may not be in github.event.pull_request.labels)
          LABELS=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          if echo "$LABELS" | grep -q "security-sync"; then
            IS_SECURITY_SYNC="true"
          fi

          SHOULD_PROCESS="false"
          if [[ "$IS_DEPENDABOT" == "true" || "$IS_SECURITY_SYNC" == "true" ]]; then
            SHOULD_PROCESS="true"
          fi

          echo "is-dependabot=$IS_DEPENDABOT" >> $GITHUB_OUTPUT
          echo "is-security-sync=$IS_SECURITY_SYNC" >> $GITHUB_OUTPUT
          echo "should-process=$SHOULD_PROCESS" >> $GITHUB_OUTPUT

  # =============================================================================
  # Auto-merge and create patch version tag
  # =============================================================================
  automerge:
    name: Auto-merge & Tag
    needs: [check-dependabot]
    if: needs.check-dependabot.outputs.should-process == 'true'
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.wait-merge.outputs.merged }}
      dependency-names: ${{ steps.dep-info.outputs.dep-names }}
      update-type: ${{ steps.dep-info.outputs.update-type }}
      package-ecosystem: ${{ steps.dep-info.outputs.ecosystem }}

    steps:
      # NOTE: do NOT add a `gh pr checks --watch` gate here. This job is itself
      # reported as the "Auto-merge & Tag" check on the PR, so watching *all*
      # PR checks waits on this job too — a self-referential deadlock that ran
      # until the 6h max-job timeout and never merged. Gating is delegated to
      # `gh pr merge --auto` below, which merges only once the branch's required
      # status checks (CI) pass.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PAT_TOKEN }}

      - name: Get Dependabot metadata
        if: needs.check-dependabot.outputs.is-dependabot == 'true'
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata from PR body (security sync)
        if: needs.check-dependabot.outputs.is-security-sync == 'true'
        id: sync-metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # The sync-v2 job below writes the package list into the PR body as a
          # structured marker. The title is free text and is deliberately not
          # parsed: a greedy `bump (.*) from` read once ran to the "from" in
          # "(security sync from main)".
          MARKER=$(printf '%s\n' "$PR_BODY" | grep -o '<!-- security-sync-packages: [^>]* -->' | head -n1 || true)
          LIST="${MARKER#<!-- security-sync-packages: }"
          LIST="${LIST% -->}"
          if [[ -n "$MARKER" && "$LIST" =~ ^[a-z0-9._-]+(\ [a-z0-9._-]+)*$ ]]; then
            DEP_NAME="${LIST// /, }"
          else
            DEP_NAME="(see PR)"
          fi
          echo "dependency-names=$DEP_NAME" >> "$GITHUB_OUTPUT"
          echo "update-type=version-update:semver-patch" >> "$GITHUB_OUTPUT"

      - name: Resolve dependency info
        id: dep-info
        # Values derived from the PR title (sync-metadata) are attacker-influenced
        # under pull_request_target. Bind every ${{ }} expression to an env var and
        # reference the shell variable so nothing is expanded into the script text.
        env:
          IS_DEPENDABOT: ${{ needs.check-dependabot.outputs.is-dependabot }}
          DBM_DEP_NAMES: ${{ steps.dependabot-metadata.outputs.dependency-names }}
          DBM_UPDATE_TYPE: ${{ steps.dependabot-metadata.outputs.update-type }}
          DBM_ECOSYSTEM: ${{ steps.dependabot-metadata.outputs.package-ecosystem }}
          SYNC_DEP_NAMES: ${{ steps.sync-metadata.outputs.dependency-names }}
          SYNC_UPDATE_TYPE: ${{ steps.sync-metadata.outputs.update-type }}
        run: |
          if [[ "$IS_DEPENDABOT" == "true" ]]; then
            echo "dep-names=$DBM_DEP_NAMES" >> "$GITHUB_OUTPUT"
            echo "update-type=$DBM_UPDATE_TYPE" >> "$GITHUB_OUTPUT"
            echo "ecosystem=$DBM_ECOSYSTEM" >> "$GITHUB_OUTPUT"
          else
            echo "dep-names=$SYNC_DEP_NAMES" >> "$GITHUB_OUTPUT"
            echo "update-type=$SYNC_UPDATE_TYPE" >> "$GITHUB_OUTPUT"
          fi

      # Written to $RUNNER_TEMP rather than committed as .github/scripts/*.sh:
      # under `pull_request_target` the workflow file always comes from the
      # default branch, but the checkout is of the PR's *base* branch — a
      # committed helper would be missing whenever the base is `v2`.
      - name: Prepare merge helper
        run: |
          cat > "$RUNNER_TEMP/merge-when-green.sh" <<'HELPER'
          #!/usr/bin/env bash
          # Merge a PR as soon as its required CI check is green.
          #
          # `gh pr merge --auto` is preferred, but GitHub only accepts it when the
          # PR's BASE branch has protection / a ruleset with required status checks.
          # `v2` had none (its ruleset targeted `refs/heads/V2` — wrong case), so the
          # call failed outright and every v2 version-bump PR stalled (#153). Fall
          # back to polling the required check and merging explicitly.
          #
          # NOTE (#118): never gate on `gh pr checks --watch` here. This job is itself
          # reported as the "Auto-merge & Tag" check, so watching *all* checks waits on
          # this job — a self-referential deadlock that ran to the 6h job timeout. We
          # poll one named check ("CI Success") that is produced by a different workflow.
          set -euo pipefail

          PR="${1:?usage: merge-when-green.sh <pr-number-or-branch> [required-check]}"
          REQUIRED_CHECK="${2:-CI Success}"
          POLL_INTERVAL="${POLL_INTERVAL:-20}"
          MAX_ATTEMPTS="${MAX_ATTEMPTS:-90}"  # 90 * 20s = 30 min

          if gh pr merge --auto --squash "$PR"; then
            echo "auto-merge enabled (or merged) for $PR"
            exit 0
          fi

          echo "::warning::native auto-merge unavailable for $PR (base branch likely unprotected) — falling back to an explicit '$REQUIRED_CHECK' gate"

          for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt++)); do
            STATE=$(gh pr view "$PR" --json state --jq '.state')
            case "$STATE" in
              MERGED) echo "$PR is merged"; exit 0 ;;
              CLOSED) echo "::error::$PR was closed without merging"; exit 1 ;;
            esac

            CONCLUSION=$(gh pr view "$PR" --json statusCheckRollup --jq '.statusCheckRollup' \
              | jq -r --arg c "$REQUIRED_CHECK" '
                  [.[] | select((.name // .context) == $c)] | .[0]
                  | if . == null then "PENDING"
                    elif .__typename == "StatusContext" then .state
                    elif .status != "COMPLETED" then "PENDING"
                    else .conclusion end')

            case "$CONCLUSION" in
              SUCCESS|NEUTRAL|SKIPPED)
                echo "'$REQUIRED_CHECK' is $CONCLUSION — merging $PR"
                gh pr merge --squash "$PR"
                exit 0
                ;;
              FAILURE|ERROR|CANCELLED|TIMED_OUT|ACTION_REQUIRED|STARTUP_FAILURE)
                echo "::error::'$REQUIRED_CHECK' concluded $CONCLUSION on $PR — not merging"
                exit 1
                ;;
              *)
                echo "waiting for '$REQUIRED_CHECK' on $PR ($CONCLUSION) — attempt $attempt/$MAX_ATTEMPTS"
                sleep "$POLL_INTERVAL"
                ;;
            esac
          done

          echo "::error::'$REQUIRED_CHECK' did not conclude on $PR within the timeout"
          exit 1
          HELPER
          chmod +x "$RUNNER_TEMP/merge-when-green.sh"

      - name: Enable auto-merge
        run: '"$RUNNER_TEMP/merge-when-green.sh" "$PR_NUMBER"'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Wait for merge
        id: wait-merge
        run: |
          MAX_ATTEMPTS=30
          ATTEMPT=0

          while [[ $ATTEMPT -lt $MAX_ATTEMPTS ]]; do
            STATE=$(gh pr view "${{ github.event.pull_request.number }}" --json state -q '.state')

            if [[ "$STATE" == "MERGED" ]]; then
              echo "PR merged successfully"
              echo "merged=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Waiting for PR to merge... (attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)"
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "PR did not merge in time"
          echo "merged=false" >> $GITHUB_OUTPUT
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout base branch after merge
        if: steps.wait-merge.outputs.merged == 'true'
        run: |
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          git fetch origin "$BASE_BRANCH"
          git checkout "$BASE_BRANCH"
          git pull origin "$BASE_BRANCH"

      - name: Install uv
        if: steps.wait-merge.outputs.merged == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Configure Git
        if: steps.wait-merge.outputs.merged == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create version bump PR
        if: steps.wait-merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          # Bind context/step outputs to env vars — never expand them into the script text.
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          DEP_NAMES: ${{ steps.dep-info.outputs.dep-names }}
          UPDATE_TYPE: ${{ steps.dep-info.outputs.update-type }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Calculate version from the BASE BRANCH's pyproject.toml (not main's)
          # This ensures v2 (0.20.x) and main (0.31.x) bump independently
          CURRENT_VERSION=$(grep -E '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          NEW_TAG="v${NEW_VERSION}"
          BRANCH="chore/version-bump-${NEW_VERSION}"

          echo "Base branch: $BASE_BRANCH, Current: $CURRENT_VERSION, New: $NEW_VERSION"

          git checkout -b "$BRANCH"

          # Update version files
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml
          sed -i "s/__version__ = \".*\"/__version__ = \"$NEW_VERSION\"/" src/surreal_orm/__init__.py
          sed -i "s/__version__ = \".*\"/__version__ = \"$NEW_VERSION\"/" src/surreal_sdk/__init__.py
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" src/surreal_sdk/pyproject.toml

          # Regenerate lockfile
          uv lock

          git add pyproject.toml src/surreal_orm/__init__.py src/surreal_sdk/__init__.py src/surreal_sdk/pyproject.toml uv.lock
          git commit -m "chore(release): bump version to $NEW_VERSION"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore(release): bump version to $NEW_VERSION" \
            --body "## Version Bump

          Automated version bump after merging Dependabot PR #$PR_NUMBER.

          ### Updated Dependencies
          - **Package:** $DEP_NAMES
          - **Update type:** $UPDATE_TYPE

          ---
          *This PR was automatically created by the Dependabot auto-merge workflow.*" \
            --base "$BASE_BRANCH" \
            --head "$BRANCH"

          "$RUNNER_TEMP/merge-when-green.sh" "$BRANCH"

  # =============================================================================
  # Sync dependency update to V2 branch (if the same dep exists there)
  # =============================================================================
  sync-v2:
    name: Sync to V2
    needs: [automerge]
    # Only sync to v2 when the PR targets main (not when it already targets v2)
    if: |
      needs.automerge.outputs.merged == 'true' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Decide whether this update is synced
        id: gate
        env:
          ECOSYSTEM: ${{ needs.automerge.outputs.package-ecosystem }}
        run: |
          # Only `uv` updates are synced. main configures no `uv` *version*
          # updates (dependabot.yml has `pip` only), so a `uv` PR on main is a
          # Dependabot *security* update, which Dependabot opens on the default
          # branch only. Routine version updates reach v2 through its own
          # `target-branch: v2` entry; syncing them too would race it on the same
          # uv.lock lines and ship a v2 release for a ruff bump. GitHub Actions
          # bumps have nothing to sync into v2's uv.lock.
          # Guarded by tests/test_sync_v2_grouped.py::TestUvMeansSecurity.
          if [[ -z "$ECOSYSTEM" ]]; then
            echo "::error::No package ecosystem in the Dependabot metadata — cannot tell whether this update belongs on v2"
            exit 1
          fi
          if [[ "$ECOSYSTEM" == "uv" ]]; then
            echo "sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "sync=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not syncing a '$ECOSYSTEM' update to v2 — only uv security updates are synced"
          fi

      - name: Checkout v2 branch
        if: steps.gate.outputs.sync == 'true'
        uses: actions/checkout@v7
        with:
          ref: v2
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        if: steps.gate.outputs.sync == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        if: steps.gate.outputs.sync == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Check which dependencies exist in v2
        if: steps.gate.outputs.sync == 'true'
        id: check
        env:
          DEP_NAME: ${{ needs.automerge.outputs.dependency-names }}
        run: |
          # A grouped Dependabot PR reports its dependencies as ONE comma-separated
          # string ("tornado, urllib3"). Looking that string up as a single package
          # name matched nothing, and every grouped update was silently skipped for
          # v2 (#217). Split it, and check each package on its own.
          #
          # Anything that does not read as a list of package names fails the job:
          # a format this step does not understand must turn red, never "skip" green.
          IFS=',' read -r -a ITEMS <<< "$DEP_NAME"
          if [[ ${#ITEMS[@]} -eq 0 ]]; then
            echo "::error::No dependency names received from the automerge job (got '$DEP_NAME')"
            exit 1
          fi

          PACKAGES=()
          for ITEM in "${ITEMS[@]}"; do
            NAME="${ITEM#"${ITEM%%[![:space:]]*}"}"
            NAME="${NAME%"${NAME##*[![:space:]]}"}"
            if [[ ! "$NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "::error::Cannot read '$ITEM' (from '$DEP_NAME') as a package name — refusing to guess"
              exit 1
            fi
            # uv.lock stores normalised (PEP 503) names.
            PKG=$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[._-]+/-/g')
            if grep -qx "name = \"$PKG\"" uv.lock 2>/dev/null; then
              PACKAGES+=("$PKG")
              echo "Found '$PKG' in v2"
            else
              echo "'$PKG' is not in v2's uv.lock — not synced"
            fi
          done

          if [[ ${#PACKAGES[@]} -eq 0 ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "None of '$DEP_NAME' is used on v2 — nothing to sync"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "packages=${PACKAGES[*]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update dependencies and create PR
        if: steps.gate.outputs.sync == 'true' && steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          # Bind every ${{ }} expression to env, never expand it into the script.
          PACKAGES: ${{ steps.check.outputs.packages }}
          UPDATE_TYPE: ${{ needs.automerge.outputs.update-type }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
        run: |
          read -r -a PKGS <<< "$PACKAGES"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BEFORE=$(mktemp)
          git show HEAD:uv.lock > "$BEFORE"
          # main's lock is the reference for "did the fix reach v2?".
          MAIN_LOCK=$(mktemp)
          git fetch -q --depth=1 origin main
          git show FETCH_HEAD:uv.lock > "$MAIN_LOCK"

          # One resolution for the whole group, within v2's own constraints
          # (pyproject pins such as cbor2 <6 still hold).
          UPGRADE_ARGS=()
          for P in "${PKGS[@]}"; do UPGRADE_ARGS+=(--upgrade-package "$P"); done
          uv lock "${UPGRADE_ARGS[@]}"

          # Every version a lock holds for a name: forked resolutions (per-python
          # markers) give one name several [[package]] entries.
          versions_in() {
            awk -v name="name = \"$2\"" '$0 == name { getline; gsub(/^version = "|"$/, ""); print }' "$1" \
              | sort -uV | paste -sd' ' -
          }
          newest() { tr ' ' '\n' <<< "$1" | sort -V | tail -n1; }
          only_in() {  # versions in $1 that are not in $2
            local out
            out=$(comm -23 <(tr ' ' '\n' <<< "$1" | sort) <(tr ' ' '\n' <<< "$2" | sort) | sort -V | paste -sd' ' -)
            echo "${out// /, }"
          }

          CHANGED=() ROWS=() HELD=()
          for P in "${PKGS[@]}"; do
            OLD=$(versions_in "$BEFORE" "$P")
            NEW=$(versions_in uv.lock "$P")
            ON_MAIN=$(versions_in "$MAIN_LOCK" "$P")
            if [[ "$OLD" != "$NEW" ]]; then
              CHANGED+=("$P")
              ROWS+=("| \`$P\` | $(only_in "$OLD" "$NEW") → $(only_in "$NEW" "$OLD") |")
            fi
            V2_TOP=$(newest "$NEW")
            MAIN_TOP=$(newest "$ON_MAIN")
            if [[ -n "$MAIN_TOP" && "$V2_TOP" != "$MAIN_TOP" && "$(printf '%s\n%s\n' "$V2_TOP" "$MAIN_TOP" | sort -V | tail -n1)" == "$MAIN_TOP" ]]; then
              HELD+=("| \`$P\` | $V2_TOP | $MAIN_TOP |")
              # A fix that cannot reach v2 must not look like "already up to date".
              echo "::warning::$P stays at $V2_TOP on v2 while main has $MAIN_TOP — v2's constraints hold it back; check whether the advisory affects v2"
            fi
          done

          if [[ ${#HELD[@]} -gt 0 && -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "### Held back on v2"
              echo "| Package | v2 | main |"
              echo "|---|---|---|"
              printf '%s\n' "${HELD[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ ${#CHANGED[@]} -eq 0 ]]; then
            if git diff --quiet uv.lock; then
              echo "No named package moved — v2 already has ${PKGS[*]} at the resolvable version"
            else
              echo "::warning::uv.lock changed but none of ${PKGS[*]} moved — not syncing transitive-only changes"
            fi
            exit 0
          fi

          # Title: bounded (GitHub caps it at 256), the full list goes in the body.
          SHOWN=("${CHANGED[@]:0:3}")
          LIST=$(IFS=,; echo "${SHOWN[*]}")
          LIST="${LIST//,/, }"
          if [[ ${#CHANGED[@]} -gt 3 ]]; then
            LIST="$LIST and $(( ${#CHANGED[@]} - 3 )) more"
          fi
          TITLE="chore(deps): bump $LIST (security sync from main)"

          # Branch: deterministic for the same update, bounded in length.
          KEY=$(for P in "${CHANGED[@]}"; do echo "$P=$(versions_in uv.lock "$P")"; done | sort)
          BRANCH="chore/sync-v2-$(printf '%s' "$KEY" | sha256sum | cut -c1-10)"

          # Dedupe on an OPEN PR, not on the branch: a branch left behind by a
          # failed `gh pr create`, or by a closed PR, must not turn re-runs green.
          OWNER="${GITHUB_REPOSITORY%%/*}"
          OPEN=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$OWNER:$BRANCH&base=v2&state=open" --jq length)
          if [[ "$OPEN" != "0" ]]; then
            echo "::notice::An open sync PR already carries this update ($BRANCH) — nothing to do"
            exit 0
          fi

          git checkout -B "$BRANCH"
          git add uv.lock
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"

          HELD_SECTION=""
          if [[ ${#HELD[@]} -gt 0 ]]; then
            HELD_SECTION="
          ### Held back by v2's constraints
          | Package | v2 | main |
          |---|---|---|
          $(printf '%s\n' "${HELD[@]}")
          "
          fi

          PR_BODY="## Security sync from \`main\`

          Dependabot security update #$SOURCE_PR, already merged on \`main\`, applied to v2's own lock (v2's constraints still apply).

          | Package | v2 |
          |---|---|
          $(printf '%s\n' "${ROWS[@]}")
          $HELD_SECTION
          - **Update type:** $UPDATE_TYPE

          <!-- security-sync-packages: ${CHANGED[*]} -->

          ---
          *This PR was automatically created by the security sync workflow.*"

          gh pr create \
            --title "$TITLE" \
            --body "$PR_BODY" \
            --base v2 \
            --head "$BRANCH" \
            --label "security-sync,dependencies"
