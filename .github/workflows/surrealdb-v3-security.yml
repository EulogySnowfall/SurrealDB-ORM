# SurrealDB 3.3.x Security Monitor (runs from main, targets the v3 branch)
#
# WHY THIS FILE LIVES ON MAIN:
#   GitHub Actions only runs scheduled (cron) workflows from the default branch.
#   Since `main` is the default branch, this workflow must live here to fire daily.
#   It checks out the `v3` branch for testing and creates PRs targeting `v3`.
#
# The v3 branch is the permanent SurrealDB 3.x line (#579): bug and security
# fixes only. Its pin moves for a *security* release of the pinned 3.3 line and
# for nothing else: never another minor (3.4.x), never another major (4.x),
# never a downgrade, never a routine release.
#
# Flow:
#   1. Compare v3's .surrealdb-version against the newest stable v3.3.x GitHub
#      release (by version, across every page: #234)
#   2. Not newer, or not a security release -> skip (no wasted CI minutes)
#   3. Otherwise -> run unit + integration tests against it (using v3 code)
#   4. If tests pass -> create a pin PR targeting v3, merged once CI passes
#   5. After it merges -> a version bump PR on v3, whose squash subject fires
#      v3's own tag-release.yml (tag) and then publish.yml (PyPI)
#   6. If tests fail -> create GitHub issue for investigation

name: "SurrealDB 3.3.x Security Monitor (v3 branch)"

on:
  schedule:
    # Run daily at 7:45 AM Montreal time (UTC-5 -> 12:45 UTC), after the main
    # (12:00) and v2 (12:30) monitors, to avoid resource contention.
    - cron: '45 12 * * *'
  workflow_dispatch:
    # No `force_update` input, unlike the other monitors: a forced run would
    # re-open a PR for the pinned version or bypass the security-only rule.
    inputs:
      surrealdb_version:
        description: 'SurrealDB 3.3.x security release to test (e.g. 3.3.6, leave empty for the newest v3.3.x)'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  SURREALDB_URL: http://localhost:8000
  SURREALDB_USER: root
  SURREALDB_PASS: root
  SURREALDB_NAMESPACE: test
  SURREALDB_DATABASE: test

jobs:
  # =============================================================================
  # Step 1: Check if there is a new SurrealDB 3.3.x security release
  # =============================================================================
  check-release:
    name: Check SurrealDB 3.3.x Release
    runs-on: ubuntu-latest
    outputs:
      latest-version: ${{ steps.check.outputs.latest-version }}
      current-version: ${{ steps.check.outputs.current-version }}
      # `false` while main owns the patch series and the selection is skipped.
      has-update: ${{ steps.check.outputs.has-update || 'false' }}
      is-security-patch: ${{ steps.check.outputs.is-security-patch }}
      docker-tag: ${{ steps.check.outputs.docker-tag }}

    steps:
      - name: Checkout v3 branch
        uses: actions/checkout@v7
        with:
          ref: v3

      # One patch series has one owner (#579). While main's pyproject.toml has
      # the same X.Y as v3's, main owns that series and main's 3.x monitor
      # covers the 3.3 line: a v3 pin PR would end in a v3 bump computing a
      # number main also computes. So the selection is skipped, has-update is
      # false and no later job runs (no tests, no PR, no bump, no issue).
      # Fail closed: a version that cannot be read fails the run.
      - name: Defer to main while it owns the patch series
        id: owner
        run: |
          VERSION_RE='^0\.[0-9]+\.[0-9]+$'
          read_version() { sed -nE 's/^version = "([^"]*)"$/\1/p' | head -n1; }

          V3_VERSION=$(read_version < pyproject.toml) || V3_VERSION=""
          if [[ ! "$V3_VERSION" =~ $VERSION_RE ]]; then
            echo "::error::Cannot read v3's version from its pyproject.toml"
            exit 1
          fi
          if ! git fetch -q --depth=1 origin main; then
            echo "::error::Cannot fetch main to read its version"
            exit 1
          fi
          MAIN_VERSION=$(git show FETCH_HEAD:pyproject.toml | read_version) || MAIN_VERSION=""
          if [[ ! "$MAIN_VERSION" =~ $VERSION_RE ]]; then
            echo "::error::Cannot read main's version from its pyproject.toml"
            exit 1
          fi

          if [[ "${MAIN_VERSION%.*}" == "${V3_VERSION%.*}" ]]; then
            echo "follows-main=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v3 follows main until main leaves ${MAIN_VERSION%.*}.x; no pin update for v3"
          else
            echo "follows-main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare versions
        id: check
        if: steps.owner.outputs.follows-main == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Inputs reach the script as data, as in the pre-release canary.
          INPUT_VERSION: ${{ inputs.surrealdb_version }}
        run: |
          # --- Determine latest v3.3.x version ---
          if [[ -n "$INPUT_VERSION" ]]; then
            LATEST_VERSION="$INPUT_VERSION"

            # The whole value must be a 3.3.Z version (see surrealdb-security.yml):
            # it becomes the pin, the image tag and the PR title. Another minor
            # or major is never proposed for the v3 branch, even by hand.
            VERSION_RE='^3\.3\.[0-9]+(-[0-9A-Za-z.]+)?$'
            if [[ ! "$LATEST_VERSION" =~ $VERSION_RE ]]; then
              echo "ERROR: the dispatched version is not a 3.3.Z release: $LATEST_VERSION"
              echo "This workflow only supports the SurrealDB 3.3 line of the v3 branch."
              exit 1
            fi
          else
            # The newest *stable* v3.3.x release, by version — not the first one
            # listed. The API lists by tag creation date, so a backport on an
            # older line hides the newest one (#234; see surrealdb-security.yml).
            # Every page is read, and the `sed` keeps plain 3.3.Z tags only, so
            # 3.4.x, 4.x and a mislabelled 3.3.7-rc.1 never become candidates.
            # An API failure fails the step here: it is not "nothing to do".
            RELEASE_TAGS=$(gh api --paginate "repos/surrealdb/surrealdb/releases?per_page=100" \
              --jq '.[] | select(.tag_name | startswith("v3.")) | select(.prerelease == false) | select(.draft == false) | .tag_name')
            LATEST_VERSION=$(printf '%s\n' "$RELEASE_TAGS" \
              | sed -nE 's/^v(3\.3\.[0-9]+)$/\1/p' | sort -V | tail -1)

            # No fallback to `releases/latest`: that is the newest release of
            # *any* line.
            if [[ -z "$LATEST_VERSION" ]]; then
              echo "No stable SurrealDB 3.3.x release found — nothing to do."
              echo "has-update=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # --- Read current pinned version (from v3 branch) ---
          if [[ -f ".surrealdb-version" ]]; then
            CURRENT_VERSION=$(cat .surrealdb-version | tr -d '[:space:]')
          else
            CURRENT_VERSION="unknown"
          fi

          DOCKER_TAG="v${LATEST_VERSION}"

          echo "Current: $CURRENT_VERSION"
          echo "Latest:  $LATEST_VERSION"
          echo "Docker:  $DOCKER_TAG"

          # --- Compare: skip if already up to date, and NEVER downgrade ---
          # See the same guard in surrealdb-security.yml (#155): a plain `!=`
          # treats "different" as "newer", so whenever GitHub Releases lag the
          # published image tags the monitor opens a PR downgrading the pin.
          # A pre-release is never a candidate (#163). The API query already
          # filters them, but `workflow_dispatch` feeds `surrealdb_version`
          # straight through, and `sort -V` has no notion of a pre-release: it
          # ranks 3.3.0-beta.3 *above* 3.3.0, so a beta pin would also refuse
          # every later stable as a "downgrade" and stay stuck forever.
          HAS_UPDATE="false"
          if [[ "$LATEST_VERSION" == *-* ]]; then
            echo "Candidate ($LATEST_VERSION) is a pre-release — not pinning."
          elif [[ "$CURRENT_VERSION" == *-* ]]; then
            # The pin itself is a pre-release: any stable release supersedes it.
            echo "Current pin ($CURRENT_VERSION) is a pre-release — replacing with $LATEST_VERSION."
            HAS_UPDATE="true"
          elif [[ "$CURRENT_VERSION" != "$LATEST_VERSION" ]]; then
            NEWEST=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | tail -1)
            if [[ "$NEWEST" == "$LATEST_VERSION" ]]; then
              HAS_UPDATE="true"
            else
              echo "Latest release ($LATEST_VERSION) is older than the current pin ($CURRENT_VERSION) — not downgrading."
            fi
          fi

          if [[ "$HAS_UPDATE" == "false" ]]; then
            echo "Already on the latest 3.3.x version ($CURRENT_VERSION) — nothing to do."
          fi

          # --- Check if security patch ---
          IS_SECURITY_PATCH="false"
          if [[ "$HAS_UPDATE" == "true" ]]; then
            # By tag, not by scanning the first page of the list (#234). A
            # version with no release entry (#155) has no notes, which must not
            # abort the run; `gh` then prints the 404 body on stdout, which is
            # discarded.
            RELEASE_NOTES=$(gh api "repos/surrealdb/surrealdb/releases/tags/v${LATEST_VERSION}" \
              --jq '.body' 2>/dev/null) || RELEASE_NOTES=""
            RELEASE_NOTES=${RELEASE_NOTES:0:5000}

            if echo "$RELEASE_NOTES" | grep -iE "(security|vulnerability|CVE-[0-9]|critical.*(fix|patch)|exploit|injection|xss|csrf)" > /dev/null 2>&1; then
              IS_SECURITY_PATCH="true"
            fi

            RELEASE_TITLE=$(gh api "repos/surrealdb/surrealdb/releases/tags/v${LATEST_VERSION}" \
              --jq '.name' 2>/dev/null) || RELEASE_TITLE=""
            if echo "$RELEASE_TITLE" | grep -iE "(security|hotfix|CVE)" > /dev/null 2>&1; then
              IS_SECURITY_PATCH="true"
            fi
          else
            RELEASE_NOTES=""
          fi

          # --- The v3 branch takes security releases only ---
          # A routine 3.3.x release leaves the pin alone: v3 receives bug and
          # security fixes, and every pin move on it ships a PyPI release.
          if [[ "$HAS_UPDATE" == "true" && "$IS_SECURITY_PATCH" != "true" ]]; then
            echo "v${LATEST_VERSION} is not a security release — the v3 branch only takes security releases."
            HAS_UPDATE="false"
          fi

          echo "Has update: $HAS_UPDATE"
          echo "Is security patch: $IS_SECURITY_PATCH"

          # --- Set outputs ---
          echo "latest-version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "has-update=$HAS_UPDATE" >> $GITHUB_OUTPUT
          echo "is-security-patch=$IS_SECURITY_PATCH" >> $GITHUB_OUTPUT
          echo "docker-tag=$DOCKER_TAG" >> $GITHUB_OUTPUT

  # =============================================================================
  # Step 2: Run tests against the new SurrealDB 3.3.x version (using v3 code)
  # =============================================================================
  test-new-version:
    name: Test SurrealDB ${{ needs.check-release.outputs.latest-version }}
    needs: check-release
    # The security condition repeats the selection step's rule on purpose
    # (tests/test_workflow_conditions.py).
    if: |
      needs.check-release.outputs.has-update == 'true' &&
      needs.check-release.outputs.is-security-patch == 'true'
    runs-on: ubuntu-latest
    outputs:
      tests-passed: ${{ steps.test-result.outputs.passed }}

    steps:
      # The version from check-release names the image, the branch, the pin and
      # the PR: check its shape again before any step uses it. Job outputs reach
      # the scripts through `env:` only (tests/test_surrealdb_monitor.py).
      - name: Validate the version output
        env:
          LATEST_VERSION: ${{ needs.check-release.outputs.latest-version }}
          DOCKER_TAG: ${{ needs.check-release.outputs.docker-tag }}
        run: |
          if [[ ! "$LATEST_VERSION" =~ ^3\.3\.[0-9]+$ ]]; then
            echo "::error::the version output is not a stable 3.3.Z version"
            exit 1
          fi
          if [[ "$DOCKER_TAG" != "v${LATEST_VERSION}" ]]; then
            echo "::error::the image tag output does not match the version output"
            exit 1
          fi

      - name: Checkout v3 branch
        uses: actions/checkout@v7
        with:
          ref: v3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      # --allow-experimental=files: v3 carries the 0.39.0 file storage tests,
      # and SORM_REQUIRE_FILES makes them fail without it (see
      # surrealdb-security.yml).
      - name: Start SurrealDB ${{ needs.check-release.outputs.docker-tag }}
        env:
          DOCKER_TAG: ${{ needs.check-release.outputs.docker-tag }}
        run: |
          echo "Testing with SurrealDB Docker tag: $DOCKER_TAG"

          docker run -d \
            --name surrealdb-test \
            -p 8000:8000 \
            "surrealdb/surrealdb:${DOCKER_TAG}" \
            start --log error --user root --pass root --allow-experimental=files memory

          ./devops/wait-for-healthy.sh localhost 8000 60

          RUNNING_VERSION=$(curl -s http://localhost:8000/version || echo "unknown")
          echo "Running SurrealDB version: $RUNNING_VERSION"

      - name: Run unit tests
        run: |
          uv run pytest tests/ -m "not integration" \
            --junitxml=junit-unit.xml \
            --cov=src \
            --cov-branch

      - name: Run integration tests
        env:
          SURREALDB_SKIP_CONTAINER: "true"
          SORM_REQUIRE_FILES: "1"
        run: |
          uv run pytest tests/ -m integration \
            --junitxml=junit-integration.xml \
            --cov=src \
            --cov-branch \
            -v

      - name: Stop SurrealDB
        if: always()
        run: docker stop surrealdb-test && docker rm surrealdb-test || true

      - name: Set test result
        id: test-result
        if: success()
        run: echo "passed=true" >> $GITHUB_OUTPUT

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: surrealdb-v3-test-results
          path: junit-*.xml

  # =============================================================================
  # Step 3: Tests passed -> pin PR on v3, then a version bump PR on v3
  # =============================================================================
  auto-update:
    name: Update SurrealDB 3.3.x Version
    needs: [check-release, test-new-version]
    if: |
      needs.check-release.outputs.has-update == 'true' &&
      needs.check-release.outputs.is-security-patch == 'true' &&
      needs.test-new-version.outputs.tests-passed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # The version from check-release names the image, the branch, the pin and
      # the PR: check its shape again before any step uses it. Job outputs reach
      # the scripts through `env:` only (tests/test_surrealdb_monitor.py).
      - name: Validate the version output
        env:
          LATEST_VERSION: ${{ needs.check-release.outputs.latest-version }}
          DOCKER_TAG: ${{ needs.check-release.outputs.docker-tag }}
        run: |
          if [[ ! "$LATEST_VERSION" =~ ^3\.3\.[0-9]+$ ]]; then
            echo "::error::the version output is not a stable 3.3.Z version"
            exit 1
          fi
          if [[ "$DOCKER_TAG" != "v${LATEST_VERSION}" ]]; then
            echo "::error::the image tag output does not match the version output"
            exit 1
          fi

      - name: Checkout v3 branch
        uses: actions/checkout@v7
        with:
          ref: v3
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Written to $RUNNER_TEMP, like the one in dependabot-automerge.yml (#153):
      # when `gh pr merge --auto` is refused for the base branch, fall back to
      # polling "CI Success" and merging explicitly.
      - name: Prepare merge helper
        run: |
          cat > "$RUNNER_TEMP/merge-when-green.sh" <<'HELPER'
          #!/usr/bin/env bash
          # Merge a PR once its required CI check is green; returns when merged.
          set -euo pipefail

          PR="${1:?usage: merge-when-green.sh <pr-number-or-branch> [required-check]}"
          REQUIRED_CHECK="${2:-CI Success}"
          POLL_INTERVAL="${POLL_INTERVAL:-20}"
          MAX_ATTEMPTS="${MAX_ATTEMPTS:-90}"  # 90 * 20s = 30 min

          AUTO="false"
          if gh pr merge --auto --squash "$PR"; then
            AUTO="true"
          else
            echo "::warning::native auto-merge unavailable for $PR — falling back to an explicit '$REQUIRED_CHECK' gate"
          fi

          for ((attempt = 1; attempt <= MAX_ATTEMPTS; attempt++)); do
            STATE=$(gh pr view "$PR" --json state --jq '.state')
            case "$STATE" in
              MERGED) echo "$PR is merged"; exit 0 ;;
              CLOSED) echo "::error::$PR was closed without merging"; exit 1 ;;
            esac

            if [[ "$AUTO" == "false" ]]; then
              CONCLUSION=$(gh pr view "$PR" --json statusCheckRollup --jq '.statusCheckRollup' \
                | jq -r --arg c "$REQUIRED_CHECK" '
                    [.[] | select((.name // .context) == $c)] | .[0]
                    | if . == null then "PENDING"
                      elif .__typename == "StatusContext" then .state
                      elif .status != "COMPLETED" then "PENDING"
                      else .conclusion end')
              case "$CONCLUSION" in
                SUCCESS|NEUTRAL|SKIPPED)
                  echo "'$REQUIRED_CHECK' is $CONCLUSION — merging $PR"
                  gh pr merge --squash "$PR"
                  continue
                  ;;
                FAILURE|ERROR|CANCELLED|TIMED_OUT|ACTION_REQUIRED|STARTUP_FAILURE)
                  echo "::error::'$REQUIRED_CHECK' concluded $CONCLUSION on $PR — not merging"
                  exit 1
                  ;;
              esac
            fi

            echo "waiting for $PR to merge — attempt $attempt/$MAX_ATTEMPTS"
            sleep "$POLL_INTERVAL"
          done

          echo "::error::$PR did not merge within the timeout"
          exit 1
          HELPER
          chmod +x "$RUNNER_TEMP/merge-when-green.sh"

      - name: Update .surrealdb-version and docker-compose.yml
        env:
          NEW_VERSION: ${{ needs.check-release.outputs.latest-version }}
          DOCKER_TAG: ${{ needs.check-release.outputs.docker-tag }}
          PREVIOUS_VERSION: ${{ needs.check-release.outputs.current-version }}
        run: |
          # chore/surrealdb-v3-* is refused into main by ci.yml's branch guard.
          BRANCH="chore/surrealdb-v3-${NEW_VERSION}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

          git checkout -b "$BRANCH"

          echo "$NEW_VERSION" > .surrealdb-version

          # Update docker-compose image tags
          sed -i "s|surrealdb/surrealdb:v[0-9][0-9a-zA-Z._-]*|surrealdb/surrealdb:${DOCKER_TAG}|g" devops/docker-compose.yml

          git add .surrealdb-version devops/docker-compose.yml

          if git diff --staged --quiet; then
            echo "::error::No pin change to commit for v${NEW_VERSION}"
            exit 1
          fi

          git commit -m "security(deps): update SurrealDB to v${NEW_VERSION} on v3" \
            -m "Tests passed against SurrealDB v${NEW_VERSION}. Previous version: v${PREVIOUS_VERSION}."

      - name: Push branch and create pin PR
        id: pin-pr
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PREVIOUS_VERSION: ${{ needs.check-release.outputs.current-version }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git push -u origin "$BRANCH"

          TITLE="[V3] security(deps): update SurrealDB to v${NEW_VERSION}"

          PR_BODY="## SurrealDB 3.3.x Security Update (v3 branch)

          | Field | Value |
          |---|---|
          | Previous | v${PREVIOUS_VERSION} |
          | New | v${NEW_VERSION} |
          | Security patch | true |
          | Branch | v3 (SurrealDB 3.x, bug and security fixes) |

          Tests already passed against this version in the [monitor workflow](${RUN_URL}).
          A version bump PR on v3 follows once this one merges.

          ---
          _Automatically created by the SurrealDB 3.3.x security monitor (running from main branch)._"

          PR_URL=$(gh pr create \
            --title "$TITLE" \
            --body "$PR_BODY" \
            --base v3 \
            --head "$BRANCH")

          echo "Created PR: $PR_URL"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for the pin PR to merge
        id: wait-merge
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PR_URL: ${{ steps.pin-pr.outputs.url }}
        run: |
          "$RUNNER_TEMP/merge-when-green.sh" "$PR_URL"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # --- After merge: version bump PR on v3 (fires v3's tag-release.yml) ---
      # A separate PR, as in surrealdb-security.yml: the squash subject of the
      # pin PR is its title, which the release gate does not match.
      - name: Checkout v3 after merge
        if: steps.wait-merge.outputs.merged == 'true'
        run: |
          git fetch origin v3
          git checkout v3
          git pull origin v3

      - name: Install uv
        if: steps.wait-merge.outputs.merged == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Create version bump PR
        if: steps.wait-merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Calculate version from v3's pyproject.toml
          CURRENT_VERSION=$(grep -E '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          BASE_VERSION=$(echo "$CURRENT_VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
          PATCH=$(echo "$BASE_VERSION" | cut -d. -f3)
          NEW_ORM_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          NEW_TAG="v${NEW_ORM_VERSION}"
          # chore/release-v3-* is refused into main by ci.yml's branch guard.
          BUMP_BRANCH="chore/release-v3-${NEW_TAG}"

          echo "Version bump: $CURRENT_VERSION -> $NEW_ORM_VERSION"

          # A computed version that is already tagged was released by another
          # branch (#579: main and v3 can both sit on 0.39.x). Stop before any
          # branch or PR exists; an unreadable remote stops the job too.
          TAG_STATUS=0
          git ls-remote --exit-code --tags origin "refs/tags/$NEW_TAG" > /dev/null || TAG_STATUS=$?
          if [[ "$TAG_STATUS" == "0" ]]; then
            echo "::error::$NEW_TAG already exists — refusing to bump to a released version"
            exit 1
          elif [[ "$TAG_STATUS" != "2" ]]; then
            echo "::error::Cannot list the remote tags (git ls-remote exited $TAG_STATUS) — not bumping"
            exit 1
          fi

          git checkout -b "$BUMP_BRANCH"

          # Update version files
          sed -i "s/^version = \".*\"/version = \"$NEW_ORM_VERSION\"/" pyproject.toml
          sed -i "s/__version__ = \".*\"/__version__ = \"$NEW_ORM_VERSION\"/" src/surreal_orm/__init__.py
          sed -i "s/__version__ = \".*\"/__version__ = \"$NEW_ORM_VERSION\"/" src/surreal_sdk/__init__.py
          sed -i "s/^version = \".*\"/version = \"$NEW_ORM_VERSION\"/" src/surreal_sdk/pyproject.toml

          # Regenerate lockfile
          uv lock

          git add pyproject.toml src/surreal_orm/__init__.py src/surreal_sdk/__init__.py src/surreal_sdk/pyproject.toml uv.lock
          git commit -m "chore(release): bump version to $NEW_ORM_VERSION"
          git push origin "$BUMP_BRANCH"

          gh pr create \
            --title "chore(release): bump version to $NEW_ORM_VERSION" \
            --body "## Version Bump (v3 branch)

          Automated version bump after the SurrealDB update to v${NEW_VERSION} on v3.

          ---
          *This PR was automatically created by the SurrealDB 3.3.x security monitor.*" \
            --base v3 \
            --head "$BUMP_BRANCH"

          "$RUNNER_TEMP/merge-when-green.sh" "$BUMP_BRANCH"

  # =============================================================================
  # Step 4: Tests failed -> create GitHub issue
  # =============================================================================
  create-failure-issue:
    name: Create Failure Issue
    needs: [check-release, test-new-version]
    # `always()` is required: without a status-check function GitHub implicitly
    # ANDs `success()` into the condition, so this job — which by definition only
    # runs when `test-new-version` failed — was always skipped.
    if: |
      always() &&
      needs.check-release.outputs.has-update == 'true' &&
      needs.test-new-version.result == 'failure'
    runs-on: ubuntu-latest

    steps:
      # The version from check-release names the image, the branch, the pin and
      # the PR: check its shape again before any step uses it. Job outputs reach
      # the scripts through `env:` only (tests/test_surrealdb_monitor.py).
      - name: Validate the version output
        env:
          LATEST_VERSION: ${{ needs.check-release.outputs.latest-version }}
          DOCKER_TAG: ${{ needs.check-release.outputs.docker-tag }}
        run: |
          if [[ ! "$LATEST_VERSION" =~ ^3\.3\.[0-9]+$ ]]; then
            echo "::error::the version output is not a stable 3.3.Z version"
            exit 1
          fi
          if [[ "$DOCKER_TAG" != "v${LATEST_VERSION}" ]]; then
            echo "::error::the image tag output does not match the version output"
            exit 1
          fi

      - name: Create issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LATEST_VERSION: ${{ needs.check-release.outputs.latest-version }}
          CURRENT_VERSION: ${{ needs.check-release.outputs.current-version }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ISSUE_TITLE="[V3] SurrealDB v${LATEST_VERSION} — integration tests failed"

          # Skip if an open issue already exists
          EXISTING=$(gh issue list --state open --search "$ISSUE_TITLE" --json number -q '.[0].number')
          if [[ -n "$EXISTING" ]]; then
            echo "Issue #$EXISTING already exists — skipping"
            exit 0
          fi

          ISSUE_BODY="## SurrealDB 3.3.x Compatibility Issue (v3 branch)

          Integration tests failed with SurrealDB v${LATEST_VERSION}, a security release.

          | Field | Value |
          |---|---|
          | Current version | v${CURRENT_VERSION} |
          | New version | v${LATEST_VERSION} |
          | Security patch | true |
          | Branch | v3 (SurrealDB 3.x, bug and security fixes) |

          ### Workflow Run
          [View logs](${RUN_URL})

          ---
          _Automatically created by the SurrealDB 3.3.x security monitor (running from main branch)._"

          gh issue create \
            --title "$ISSUE_TITLE" \
            --label "bug,surrealdb,needs-investigation" \
            --body "$ISSUE_BODY"
